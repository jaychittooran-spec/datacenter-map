
name: Refresh STACK Policy outputs

on:
  push:
    branches:
      - policy-v1
    paths:
      - 'STACK_Policy_Master.xlsx'
      - 'STACK_Policy_Approved_Template.pptx'
      - 'refresh_stack_policy.py'
      - 'export_stack_data.py'
      - 'requirements-stack.txt'
      - '.github/workflows/refresh-stack-policy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements-stack.txt

      - name: Update PowerPoint and JSON
        run: |
          python refresh_stack_policy.py
          python export_stack_data.py

      - name: Save updated files to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STACK_Policy_Intelligence_Updated.pptx data/stack_policy_*.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update STACK policy presentation and data"
            git push
          fi
